<!doctype html>
<html lang="es" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Comunicación 360</title>
<link rel="icon" type="image/svg+xml" href="assets/simbolo.svg">
<style>
@font-face{font-family:'Kurdis';src:url('assets/fonts/Kurdis-Regular.woff2') format('woff2');font-weight:400;font-display:swap}
@font-face{font-family:'Kurdis';src:url('assets/fonts/Kurdis-SemiBold.woff2') format('woff2');font-weight:600;font-display:swap}
@font-face{font-family:'Grift';src:url('assets/fonts/Grift-Regular.woff2') format('woff2');font-weight:400;font-display:swap}
@font-face{font-family:'Grift';src:url('assets/fonts/Grift-Medium.woff2') format('woff2');font-weight:500;font-display:swap}
@font-face{font-family:'Grift';src:url('assets/fonts/Grift-SemiBold.woff2') format('woff2');font-weight:600;font-display:swap}
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#E6EBF2;--frame:#FFFFFF;--side:#F6F8FB;--ink:#0B1A33;--ink2:#56637A;--ink3:#8E9AB0;
  --line:#E4E9F1;--line2:#D3DBE7;--card:#F2F5F9;--chip:#E9EEF5;
  --navy:#093169;--brand:#0F50AC;--accent:#146CE8;
  --teal:#146CE8;--teal-soft:#E3EDFC;--violet:#6457C4;--violet-soft:#ECEAFB;--coral:#093169;--coral-soft:#E4EAF4;
  --amber:#A86F0C;--amber-soft:#FBF1DC;--green:#1E7A4F;--green-soft:#E1F2E9;--red:#C2392C;--red-soft:#FBE5E2;
  --blue:#0F50AC;--blue-soft:#E3EDFC;--flag:#D9602F;--flag-soft:#FDEBE3;
  --shadow:0 1px 2px rgba(9,49,105,.05),0 18px 48px rgba(9,49,105,.08);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0C0C0D;--frame:#151516;--side:#111112;--ink:#F2F2EF;--ink2:#A8A8A3;--ink3:#6F6F6B;
  --line:#26262A;--line2:#34343A;--card:#1C1C1E;--chip:#232326;
  --teal:#7CC7BF;--teal-soft:#16302D;--violet:#AEA6F5;--violet-soft:#25223F;--coral:#FF9B73;--coral-soft:#3A2017;
  --amber:#F1C062;--amber-soft:#35290F;--green:#7DD3A3;--green-soft:#123222;--red:#FF8A7E;--red-soft:#3B1714;
  --blue:#93B6F0;--navy:#C9D8F5;--brand:#8FB4F2;--accent:#6EA5F5;--flag:#FF9B73;--flag-soft:#3A2017;--teal:#6EA5F5;--teal-soft:#15284A;--coral:#C9D8F5;--coral-soft:#1C2A44;--blue-soft:#172640;--shadow:0 1px 2px rgba(0,0,0,.3),0 18px 48px rgba(0,0,0,.4);color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0C0C0D;--frame:#151516;--side:#111112;--ink:#F2F2EF;--ink2:#A8A8A3;--ink3:#6F6F6B;
  --line:#26262A;--line2:#34343A;--card:#1C1C1E;--chip:#232326;
  --teal:#7CC7BF;--teal-soft:#16302D;--violet:#AEA6F5;--violet-soft:#25223F;--coral:#FF9B73;--coral-soft:#3A2017;
  --amber:#F1C062;--amber-soft:#35290F;--green:#7DD3A3;--green-soft:#123222;--red:#FF8A7E;--red-soft:#3B1714;
  --blue:#93B6F0;--navy:#C9D8F5;--brand:#8FB4F2;--accent:#6EA5F5;--flag:#FF9B73;--flag-soft:#3A2017;--teal:#6EA5F5;--teal-soft:#15284A;--coral:#C9D8F5;--coral-soft:#1C2A44;--blue-soft:#172640;--shadow:0 1px 2px rgba(0,0,0,.3),0 18px 48px rgba(0,0,0,.4);color-scheme:dark}
html,body{background:var(--bg)}
body{font-family:'Grift',-apple-system,'Segoe UI',system-ui,sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased;font-size:15px;line-height:1.45}
button,input,textarea,select{font:inherit;color:inherit}
.ic{flex:none;display:block}
.muted{color:var(--ink2)} .faint{color:var(--ink3)}
/* ---------- shell ---------- */
.app{display:grid;grid-template-columns:292px minmax(0,1fr);height:calc(100vh - 48px);max-width:1480px;margin:24px auto;background:var(--frame);border:1px solid var(--line);border-radius:28px;overflow:hidden;box-shadow:var(--shadow)}
.side{background:var(--side);border-right:1px solid var(--line);padding:22px 16px;display:flex;flex-direction:column;gap:16px;overflow:auto;position:relative}
.ws{display:flex;align-items:center;gap:12px;padding:8px;border-radius:16px;background:none;border:0;width:100%;text-align:left;cursor:pointer}
.ws:hover{background:var(--chip)}
.logo{width:44px;height:44px;border-radius:13px;background:var(--frame);color:var(--accent);display:grid;place-items:center;flex:none;border:1px solid var(--line)}
.logo svg{width:auto;height:28px}
.lockup{display:flex;align-items:center;gap:10px;color:var(--navy);font-weight:500;font-size:19px;letter-spacing:-.02em}
.lockup svg{color:var(--accent)}
.ws b{display:block;font-weight:500;font-size:16px;letter-spacing:-.01em;line-height:1.2}
.ws small{color:var(--ink2);font-size:13px}
.ws .ic{margin-left:auto;color:var(--ink2)}
.menu{position:absolute;left:16px;right:16px;top:84px;background:var(--frame);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);padding:8px;z-index:30}
.menu h6{font-size:11px;letter-spacing:.08em;color:var(--ink3);font-weight:500;padding:10px 10px 4px}
.menu button{display:flex;align-items:center;gap:10px;width:100%;padding:8px 10px;border:0;background:none;border-radius:10px;cursor:pointer;text-align:left}
.menu button:hover{background:var(--chip)}
.menu button .av{width:28px;height:28px;font-size:12px}
.menu button span{display:flex;flex-direction:column;line-height:1.25;font-size:14px}
.menu button small{color:var(--ink3);font-size:12px}
.menu hr{border:0;border-top:1px solid var(--line);margin:6px 4px}
.search{display:flex;align-items:center;gap:10px;background:var(--frame);border:1px solid var(--line);border-radius:14px;padding:10px 12px;color:var(--ink2)}
.search input{border:0;outline:0;background:none;flex:1;min-width:0;color:var(--ink)}
.search input::placeholder{color:var(--ink3)}
kbd{font:500 11px/1 inherit;border:1px solid var(--line2);border-radius:7px;padding:4px 6px;color:var(--ink3);background:var(--frame)}
.nav{display:flex;flex-direction:column;gap:2px}
.nav a{display:flex;align-items:center;gap:14px;padding:10px 12px;border-radius:12px;color:var(--ink);text-decoration:none;font-size:15.5px;cursor:pointer}
.nav a:hover{background:var(--chip)}
.nav a.on{background:var(--frame);box-shadow:0 0 0 1px var(--line),0 1px 2px rgba(0,0,0,.04)}
.nav .ic{color:var(--ink2)}
.nav .count{margin-left:auto;color:var(--ink3);font-size:13px}
.sec{font-size:12px;letter-spacing:.08em;color:var(--ink3);display:flex;justify-content:space-between;align-items:center;padding:0 12px;margin-top:10px}
.tree{display:flex;flex-direction:column;gap:2px}
.tree a{display:flex;align-items:center;gap:12px;padding:9px 12px;border-radius:12px;cursor:pointer;font-size:15px}
.tree a:hover{background:var(--chip)}
.tree a.on{background:var(--frame);box-shadow:0 0 0 1px var(--line)}
.tree .kid{margin-left:22px;border-left:1px solid var(--line2);border-radius:0 12px 12px 0;padding-left:16px}
.tree .count{margin-left:auto;color:var(--ink3);font-size:13px}
.side .me{margin-top:auto;display:flex;align-items:center;gap:10px;padding:10px;border-top:1px solid var(--line);padding-top:16px}
.side .me span{display:flex;flex-direction:column;line-height:1.25;font-size:14px;min-width:0}
.side .me small{color:var(--ink3);font-size:12px}
.side .me button{margin-left:auto}
.main{display:flex;flex-direction:column;min-width:0;overflow:hidden}
.crumbs{display:flex;align-items:center;gap:12px;padding:22px 40px;border-bottom:1px solid var(--line);font-size:17px;min-height:76px}
.crumbs .ic{color:var(--ink3)}
.crumbs .rolepill{margin-left:auto}
.hamb{display:none}
.content{overflow:auto;padding:36px 40px 72px;flex:1}
.scrim{display:none}
/* ---------- type ---------- */
h1.big{font-family:'Kurdis',sans-serif;font-size:40px;letter-spacing:-.02em;font-weight:400;line-height:1.08;color:var(--navy)}
.lead{font-size:16.5px;color:var(--ink2);margin-top:10px;max-width:640px}
h2{font-family:'Kurdis',sans-serif;font-size:28px;letter-spacing:-.015em;font-weight:400;margin:44px 0 18px;line-height:1.15;color:var(--navy)}
h3{font-size:17px;font-weight:600;letter-spacing:-.01em;margin-bottom:12px}
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;flex-wrap:wrap}
/* ---------- folders ---------- */
.folders{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px;margin-top:6px}
.folder{border-radius:28px;padding:16px 16px 22px;text-align:center;cursor:pointer;border:0;background:none;transition:background .25s,transform .25s}
.folder:hover{background:var(--card)}
.folder:hover svg{transform:translateY(-3px)}
.folder svg{width:100%;max-width:230px;height:auto;transition:transform .3s;display:block;margin:0 auto}
.folder b{display:block;font-size:19px;font-weight:500;margin-top:6px;letter-spacing:-.015em}
.folder span{color:var(--ink2);font-size:14.5px}
/* ---------- activity ---------- */
.activity{border-top:1px solid var(--line)}
.arow{display:flex;gap:16px;padding:18px 0;border-bottom:1px solid var(--line);cursor:pointer}
.arow:hover .atext{color:var(--ink)}
.atext{font-size:16px;color:var(--ink2);padding-top:7px}
.atext b{color:var(--ink);font-weight:500}
.bubble{background:var(--card);border-radius:14px;padding:12px 16px;margin-top:10px;color:var(--ink2);font-size:15px}
.av{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-weight:600;font-size:14px;flex:none}
/* ---------- atoms ---------- */
.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;font-size:12.5px;font-weight:500;white-space:nowrap;line-height:1.3}
.chip i{width:6px;height:6px;border-radius:50%;background:currentColor}
.c-blue{background:var(--blue-soft);color:var(--blue)}.c-violet{background:var(--violet-soft);color:var(--violet)}
.c-amber{background:var(--amber-soft);color:var(--amber)}.c-teal{background:var(--teal-soft);color:var(--teal)}
.c-green{background:var(--green-soft);color:var(--green)}.c-red{background:var(--red-soft);color:var(--red)}
.c-coral{background:var(--coral-soft);color:var(--flag)}.c-slate,.c-gray{background:var(--chip);color:var(--ink2)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:11px 18px;border-radius:12px;border:1px solid var(--line2);background:var(--frame);color:var(--ink);font-weight:500;font-size:14.5px;line-height:1;cursor:pointer;transition:transform .15s,background .15s;text-decoration:none;white-space:nowrap}
.btn:hover{background:var(--card)}
.btn:active{transform:scale(.98)}
.btn.pri{background:var(--navy);color:#fff;border-color:var(--navy)}
.btn.pri:hover{opacity:.9}
.btn.ghost{border-color:transparent;background:none}
.btn.ghost:hover{background:var(--chip)}
.btn.sm{padding:7px 12px;font-size:13px;border-radius:10px}
.btn.icon{padding:8px;border-radius:10px}
.btn:disabled{opacity:.4;cursor:not-allowed;transform:none}
.btn.danger{color:var(--red)}
.card{background:var(--frame);border:1px solid var(--line);border-radius:20px;padding:22px}
.card.soft{background:var(--card);border-color:transparent}
.card + .card{margin-top:16px}
.grid2{display:grid;grid-template-columns:minmax(0,1fr) 350px;gap:24px;align-items:start}
.split{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px;margin-top:28px}
.kpi{background:var(--card);border-radius:20px;padding:20px}
.kpi small{color:var(--ink2);font-size:13.5px}
.kpi b{font-family:'Kurdis',sans-serif;font-size:36px;letter-spacing:-.02em;font-weight:600;display:block;margin-top:6px;line-height:1}
.kpi em{font-style:normal;font-size:12.5px;color:var(--ink3);display:block;margin-top:8px}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:18px}
.kv small{display:block;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink3);margin-bottom:6px}
.kv div{font-size:15px}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.field{display:flex;flex-direction:column;gap:8px;margin-top:22px}
.field label{font-weight:500;font-size:15px}
.field .hint{font-size:13px;color:var(--ink3);margin-top:-4px}
.in{width:100%;border:1px solid var(--line2);background:var(--frame);border-radius:14px;padding:13px 15px;outline:0;transition:border .15s,box-shadow .15s}
.in:focus{border-color:var(--accent);box-shadow:0 0 0 4px var(--teal-soft)}
textarea.in{resize:vertical;min-height:96px;line-height:1.5}
select.in{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--ink2) 50%),linear-gradient(135deg,var(--ink2) 50%,transparent 50%);background-position:calc(100% - 18px) 50%,calc(100% - 13px) 50%;background-size:5px 5px;background-repeat:no-repeat;padding-right:36px}
.sel{padding:8px 32px 8px 12px;border-radius:10px;font-size:13.5px}
/* ---------- wizard ---------- */
.wsteps{display:flex;gap:6px;margin:26px 0 30px;flex-wrap:wrap}
.wst{display:flex;align-items:center;gap:8px;padding:7px 14px 7px 7px;border-radius:999px;background:var(--card);color:var(--ink3);font-size:14px;font-weight:500}
.wst span{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;background:var(--frame);font-size:12px;border:1px solid var(--line2)}
.wst.cur{background:var(--navy);color:#fff}
.wst.cur span{background:#fff;color:var(--navy);border-color:transparent}
.wst.done{color:var(--ink)}
.wst.done span{background:var(--navy);color:#fff;border-color:var(--navy)}
.opts{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.opt{border:1px solid var(--line);border-radius:18px;padding:16px;background:var(--frame);cursor:pointer;text-align:left;display:flex;flex-direction:column;gap:12px;transition:border .15s,box-shadow .15s,transform .15s;min-height:104px}
.opt:hover{transform:translateY(-2px);border-color:var(--line2)}
.opt .oi{width:38px;height:38px;border-radius:12px;background:var(--card);display:grid;place-items:center;color:var(--ink2)}
.opt b{font-weight:500;font-size:15px;line-height:1.25}
.opt small{color:var(--ink3);font-size:12.5px;display:block;margin-top:2px}
.opt.on{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.opt.on .oi{background:var(--accent);color:#fff}
.pills{display:flex;flex-wrap:wrap;gap:8px}
.pill{border:1px solid var(--line2);background:var(--frame);border-radius:999px;padding:9px 15px;cursor:pointer;font-size:14px;transition:all .15s}
.pill:hover{border-color:var(--ink3)}
.pill.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.drop{border:1.5px dashed var(--line2);border-radius:18px;padding:22px;display:flex;align-items:center;gap:14px;cursor:pointer;color:var(--ink2);transition:border .15s}
.drop:hover{border-color:var(--ink3)}
.files{display:flex;flex-wrap:wrap;gap:10px;margin-top:10px}
.file{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:14px;padding:8px 10px 8px 8px;font-size:13.5px;background:var(--frame)}
.file img,.file .ph{width:40px;height:40px;border-radius:9px;object-fit:cover;background:var(--card);display:grid;place-items:center;color:var(--ink3)}
.file small{color:var(--ink3);display:block;font-size:12px}
.wfoot{display:flex;justify-content:space-between;gap:12px;margin-top:34px;padding-top:22px;border-top:1px solid var(--line)}
.alert{display:flex;gap:14px;border-radius:18px;padding:16px 18px;margin-top:18px}
.alert.amber{background:var(--amber-soft);color:var(--amber)}
.alert.amber p,.alert.amber b{color:var(--ink)}
.alert.green{background:var(--green-soft);color:var(--green)}
.alert.green p{color:var(--ink)}
.alert.red{background:var(--red-soft);color:var(--red)}
.alert.red p{color:var(--ink)}
.alert p{font-size:14.5px}
.sum{display:grid;grid-template-columns:170px minmax(0,1fr) auto;gap:10px 18px;align-items:start}
.sum dt{color:var(--ink3);font-size:13.5px;padding-top:2px}
.sum dd{font-size:15px;white-space:pre-wrap}
.sum hr{grid-column:1/-1;border:0;border-top:1px solid var(--line);margin:6px 0}
.link{background:none;border:0;color:var(--ink2);text-decoration:underline;text-underline-offset:3px;cursor:pointer;font-size:13.5px}
.bignum{font-family:'Kurdis',sans-serif;font-size:64px;font-weight:600;letter-spacing:-.03em;line-height:1}
/* ---------- list ---------- */
.filters{display:flex;gap:8px;flex-wrap:wrap;margin:22px 0 10px}
.lhead,.lrow{display:grid;grid-template-columns:100px minmax(0,2.1fr) minmax(0,1.3fr) 130px minmax(0,1.1fr) 170px;align-items:center;gap:16px;padding:14px 16px}
.lhead{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink3);border-bottom:1px solid var(--line)}
.lrow{border-bottom:1px solid var(--line);cursor:pointer;border-radius:14px;transition:background .15s}
.lrow:hover{background:var(--card)}
.lrow .t b{font-weight:500;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lrow .t small{color:var(--ink3);font-size:13px}
.idc{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12.5px;color:var(--ink2)}
.empty{padding:48px 20px;text-align:center;color:var(--ink3)}
/* ---------- detail ---------- */
.back{display:inline-flex;align-items:center;gap:6px;color:var(--ink2);cursor:pointer;background:none;border:0;font-size:14px;margin-bottom:16px}
.stepper{display:flex;margin:26px 0 30px}
.stp{flex:1;position:relative;font-size:13px;color:var(--ink3);min-width:0}
.stp .dot{width:30px;height:30px;border-radius:50%;border:1.5px solid var(--line2);display:grid;place-items:center;background:var(--frame);position:relative;z-index:1;font-size:12px;font-weight:500}
.stp::before{content:'';position:absolute;left:30px;right:0;top:14.5px;height:1.5px;background:var(--line2)}
.stp:last-child{flex:0 0 auto}
.stp:last-child::before{display:none}
.stp.done .dot{background:var(--navy);border-color:var(--navy);color:#fff}
.stp.done::before{background:var(--navy)}
.stp.cur{color:var(--ink);font-weight:500}
.stp.cur .dot{border-color:var(--accent);box-shadow:0 0 0 5px var(--teal-soft)}
.stp span{display:block;margin-top:9px;white-space:nowrap}
.piece{background:var(--card);border-radius:16px;padding:18px 20px;font-size:17px;line-height:1.5;white-space:pre-wrap;font-weight:500;letter-spacing:-.01em}
.timeline{display:flex;flex-direction:column}
.tl{display:flex;gap:14px;padding-bottom:16px;position:relative}
.tl::before{content:'';position:absolute;left:13px;top:30px;bottom:2px;width:1px;background:var(--line2)}
.tl:last-child::before{display:none}
.tl .av{width:28px;height:28px;font-size:11px}
.tl p{font-size:14.5px}
.tl small{color:var(--ink3);font-size:12.5px}
.act{display:flex;flex-direction:column;gap:10px}
.act textarea.in{min-height:76px}
.note{background:var(--card);border-radius:12px;padding:10px 12px;font-size:14px;margin-top:8px}
.note small{display:block;color:var(--ink3);font-size:12px;margin-bottom:2px}
.mailmini{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line);font-size:13.5px;cursor:pointer}
.mailmini:last-child{border-bottom:0}
.mailmini .ic{color:var(--ink3);margin-top:2px}
/* ---------- kanban ---------- */
.kanban{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(264px,1fr);gap:14px;overflow-x:auto;padding-bottom:12px;margin-top:26px}
.col{background:var(--side);border:1px solid var(--line);border-radius:22px;padding:12px;min-height:240px}
.colh{display:flex;align-items:center;justify-content:space-between;padding:4px 6px 2px;font-weight:500;font-size:14.5px}
.colh span{color:var(--ink3);font-size:13px;font-weight:400}
.kc{background:var(--frame);border:1px solid var(--line);border-radius:16px;padding:14px;margin-top:10px;cursor:pointer;transition:transform .15s,box-shadow .15s}
.kc:hover{transform:translateY(-2px);box-shadow:0 8px 22px rgba(0,0,0,.06)}
.kc b{font-weight:500;font-size:14.5px;display:block;margin:6px 0 4px;line-height:1.3}
.kc small{color:var(--ink3);font-size:12.5px}
.kc .row{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:12px}

.lb{position:fixed;inset:0;background:rgba(10,10,10,.72);z-index:90;display:grid;place-items:center;padding:24px;animation:tin .2s}
.lbbox{background:var(--frame);border-radius:22px;overflow:hidden;max-width:min(960px,100%);max-height:100%;display:flex;flex-direction:column;box-shadow:var(--shadow)}

async function sync(action, r, extra){

  const u = id => { const x = U(id); return x ? {name:x.name,email:x.email,area:x.area} : null; };
  const payload = {action, gestor:INTEG.gestor, org:S.org, request:{id:r.id,title:r.title,type:TY(r.type).label,formats:r.formats.map(f=>FMT[f]?FMT[f].name:f),objective:r.objective,audience:r.audience,context:r.context,pieceText:r.pieceText,logos:r.logos,refLink:r.refLink,due:r.due,minDue:r.minDue,status:ST[r.status].l,priority:r.priority,requester:u(r.requester),assignee:u(r.assignee),rounds:r.rounds,driveUrl:r.driveUrl,queuePos:qpos(r)+1,queueLen:queue().length,history:historyText(r),created:iso(r.created),delivered:r.delivered?iso(r.delivered):null}, ...(extra||{})};
  toast('Sincronizando con Google…');

    const res = await fetch(INTEG.url, {method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'}, body: JSON.stringify(payload)});
    const j = await res.json();
    if(j.folderUrl) r.driveUrl = j.folderUrl;
    if(j.files && r.files){ j.files.forEach(f=>{ const m = r.files.find(x=>x.name===f.name); if(m) m.url = f.url; }); }

}

function resetW(){ W.step=1; W.d={type:null,title:'',formats:[],objective:null,audience:[],context:'',pieceText:'',logos:'',refLink:'',files:[],due:'',reason:''}; }
resetW();

function render(){
  const root = $('#root');
  if(!S.session || !me()){ root.innerHTML = loginView(); return; }
  const old = $('.content'); const st = old ? old.scrollTop : 0;
  root.innerHTML = shell() + lightboxHTML();
  const c = $('.content'); if(c){ if(V._top){ c.scrollTop = 0; V._top = false; } else c.scrollTop = st; }
}
// Al iniciar sesión: muestra la animación del logo (6 s) mientras se carga el espacio de trabajo.
function intro(then){
  const box = $('#intro'), v = $('#introVid'); if(!box || !v){ then(); return; }
  box.hidden = false; box.classList.remove('out');
  let done = false; const finish = () => { if(done) return; done = true; box.classList.add('out'); setTimeout(()=>{ box.hidden = true; }, 520); };
  v.currentTime = 0; const p = v.play(); if(p && p.catch) p.catch(()=>{});
  then(); // la app se construye detrás de la cortina
  v.onended = finish; setTimeout(finish, 6500);
  box.onclick = finish;
}
function go(route, extra){ Object.assign(V,{route,menu:false,side:false,_top:true,pins:[]},extra||{}); if(route==='new' && !extra?.keep) resetW(); render(); }

    solicitante:[['home','home','Mis solicitudes',mineAct],['new','plus','Nueva solicitud'],['mail','mail','Correos']],
    disenador:[['home','home','Inicio'],['board','board','Mi tablero',board],['list','inbox','Mis asignaciones',mineAct],['mail','mail','Correos']],
    supervisor:[['home','chart','Tablero de control'],['list','inbox','Todas las solicitudes',queue().length],['board','board','Tablero del equipo'],['balance','chart','Balance'],['new','plus','Nueva solicitud'],['mail','mail','Correos']],

const FILTERS = {
  all:['Todas',()=>true,'#4A4A47'], curso:['En curso',r=>['recibida','revision','asignada','diseno'].includes(r.status),'#7B72C8'],
  aprobacion:['En aprobación',r=>['aprobacion','ajustes','aprobada'].includes(r.status),'#B3ADEB'], devuelta:['Devueltas',r=>r.status==='devuelta','#E8B23A'],
  entregada:['Entregadas',r=>r.status==='entregada','#8C93F2'], cancelada:['Canceladas',r=>r.status==='cancelada','#B9B9B5'],
  prioridad:['Prioridades',r=>r.priority&&r.priority.status==='pendiente','#E2603A'],
  riesgo:['En riesgo',r=>ACTIVE.includes(r.status)&&bizDiff(today(),pISO(effDue(r)))<=1,'#C2392C'],
  porasignar:['Por asignar',r=>['recibida','revision'].includes(r.status),'#146CE8'],
  encurso:['En curso',r=>['asignada','diseno','aprobacion','ajustes','aprobada'].includes(r.status),'#7B72C8']
};
function filterFn(f){ if(f.startsWith('d:')) return r=>r.assignee===f.slice(2)&&ACTIVE.includes(r.status); if(f.startsWith('a:')) return r=>r.area===f.slice(2); return (FILTERS[f]||FILTERS.all)[1]; }
function filterLabel(f){ if(f.startsWith('d:')) return 'Asignadas a '+first(U(f.slice(2))); if(f.startsWith('a:')) return f.slice(2); return (FILTERS[f]||FILTERS.all)[0]; }

    out = `<div class="sec"><span>MIS CARPETAS</span></div><div class="tree">${node('curso','En proceso','#7B72C8')}${node('aprobacion','Esperan mi respuesta','#B3ADEB')}${node('entregada','Entregadas','#8C93F2')}${node('devuelta','Devueltas','#E8B23A')}${node('cancelada','Canceladas','#B9B9B5')}</div>`;

      <div class="sec"><span>EQUIPO</span></div><div class="tree">${designers().map(d=>`<a data-a="go" data-r="list" data-f="d:${d.id}" class="${V.route==='list'&&V.filter==='d:'+d.id?'on':''}"><span class="person">${avatar(d,22)}</span><span class="trunc">${h(d.name)}</span><span class="count">${n('d:'+d.id)}</span></a>`).join('')}</div>

function content(){
  const m = me();
  switch(V.route){
    case 'home': return m.role==='solicitante' ? reqHome() : (CAN.seeAll(m) ? dashView() : designerHome());
    case 'new': return wizardView();
    case 'sent': return sentView();
    case 'list': return listView();
    case 'detail': return me().role==='solicitante' ? reqDetail() : detailView();
    case 'board': return boardView();
    case 'mail': return mailView();
    case 'cfg': return cfgView();
    case 'balance': return balanceView();
  }
  return '';
}

/* ---------- actividad ---------- */
function activityHTML(list, n=6){
  const items = [];
  list.forEach(r => r.history.forEach(e => items.push({...e,r})));
  items.sort((a,b)=>b.at-a.at);
  if(!items.length) return '<div class="empty">Sin actividad todavía.</div>';
  return `<div class="activity">${items.slice(0,n).map(e=>{
    const u = U(e.by); const parts = e.a.split(': ');
    return `<div class="arow" data-a="open" data-id="${e.r.id}">${avatar(u)}<div style="min-width:0;flex:1"><div class="atext"><b>${h(first(u))}</b> ${h(parts[0].charAt(0).toLowerCase()+parts[0].slice(1))} · <b>${h(e.r.title)}</b> <span class="faint" style="font-size:13.5px">· ${ago(e.at)}</span></div>${parts[1]?`<div class="bubble">${h(parts.slice(1).join(': '))}</div>`:''}</div></div>`;
  }).join('')}</div>`;
}

/* ---------- SOLICITANTE: inicio simple ---------- */
function simpleSteps(r){
  const si = stepIdx(r.status), labels = ['Recibida','Asignada','En diseño','Tu aprobación','Entregada'];
  return `<div class="simple-steps">${labels.map((l,i)=>`<span class="${i<si||r.status==='entregada'?'done':''} ${i===si&&r.status!=='entregada'?'cur':''}">${l}</span>`).join('')}</div>`;
}
function reqCard(r){
  const p = qpos(r), act = ACTIVE.includes(r.status), pct = r.status==='entregada'?100:[8,30,55,80,100][stepIdx(r.status)];
  let line = '';
  if(r.status==='entregada') line = `Entregada el <b>${fmt(r.delivered)}</b> por correo`;
  else if(r.status==='aprobacion') line = `<b style="color:var(--role)">Tienes una propuesta para revisar</b>`;
  else if(r.status==='devuelta') line = `<b style="color:var(--amber)">Falta información:</b> ${h(r.returnReason)}`;
  else if(r.status==='cancelada') line = `Cancelada · ${h(r.cancelReason||'')}`;
  else if(r.status==='ajustes') line = `Pediste ajustes (ronda ${r.rounds} de ${CFG().maxRounds}); el diseñador está en ello`;
  else line = `Te la entregan el <b>${fmt(effDue(r))}</b>${r.priority&&r.priority.status==='pendiente'?' · <span style="color:var(--flag)">prioridad en revisión</span>':r.priority&&r.priority.status==='rechazada'?' · prioridad no aprobada':''}`;
  return `<div class="rqc" data-a="open" data-id="${r.id}">
    <div style="min-width:0"><div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">${stChip(r.status)}${r.priority&&r.priority.status==='aprobada'?chip('Prioridad','coral'):''}<span class="idc">${h(r.id)}</span></div>
      <h4 style="margin-top:8px">${h(r.title)}</h4>
      <div class="meta"><span>${line}</span></div>
      ${act?`<div class="prog"><i style="width:${pct}%"></i></div>${simpleSteps(r)}`:''}</div>
    ${act?`<div class="pos"><b>${p+1}</b><small>de ${queue().length} en fila</small></div>`:''}
  </div>`;
}
function reqHome(){
  const m = me(), vis = visible().sort((a,b)=>{ const A=ACTIVE.includes(a.status)||a.status==='devuelta', B=ACTIVE.includes(b.status)||b.status==='devuelta'; if(A!==B) return A?-1:1; return b.created-a.created; });
  const act = vis.filter(r=>ACTIVE.includes(r.status)), wait = vis.filter(r=>r.status==='aprobacion'||r.status==='devuelta');
  return `<div class="head"><div><h1 class="big">Hola, ${h(first(m))}</h1><p class="lead">Tienes ${act.length} solicitud${act.length===1?'':'es'} en proceso y has pedido ${vis.length} en total.${wait.length?` <b style="color:var(--ink);font-weight:500">${wait.length} espera${wait.length>1?'n':''} tu respuesta.</b>`:''}</p></div><button class="btn pri" data-a="go" data-r="new">${ic('plus',18)} Nueva solicitud</button></div>
    ${wait.length?`<div class="hero" style="cursor:pointer" data-a="open" data-id="${wait[0].id}">${ic('bell',26)}<p><b>${h(wait[0].title)}</b> ${wait[0].status==='aprobacion'?'tiene una propuesta lista. Apruébala o marca qué cambiar.':'fue devuelta: '+h(wait[0].returnReason)}</p><span style="margin-left:auto">${ic('chev',18)}</span></div>`:''}
    <div class="rq">${vis.length?vis.map(reqCard).join(''):'<div class="empty">Todavía no has pedido piezas.</div>'}</div>
    <div class="card soft" style="margin-top:28px;display:flex;gap:14px;align-items:flex-start">${ic('flag',22)}<div><b style="font-weight:500">¿Necesitas una pieza antes del plazo estándar?</b><p class="muted" style="font-size:14px;margin-top:4px">Abre la solicitud y pulsa <b>Pedir prioridad</b>. Debes explicar el motivo; el supervisor la aprueba o la niega y te avisa por correo. Mientras tanto se mantiene la fecha estándar.</p></div></div>`;
}
/* ---------- SOLICITANTE: detalle simple ---------- */
function reqDetail(){
  const r = R(V.id), m = me();
  if(!r || r.requester!==m.id) return '<div class="empty">Solicitud no encontrada.</div>';
  const p = qpos(r), act = ACTIVE.includes(r.status), t = TY(r.type);
  const canPrio = act && !r.priority && ['recibida','revision','asignada','diseno'].includes(r.status);
  const left = CFG().maxRounds - r.rounds;
  let main = '';
  if(r.status==='aprobacion' && r.proposal){
    main = `<div class="card"><h3>Revisa la propuesta</h3><p class="muted" style="font-size:14px;margin-top:-6px">Si algo no te gusta, toca el lugar exacto en la imagen y escribe qué cambiar. Si está bien, aprueba.</p>
      ${annotHTML(r, true)}
      <div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:18px"><button class="btn pri" data-a="approve" data-id="${r.id}">${ic('check',16)} Aprobar la pieza</button>${left>0?`<button class="btn" data-a="adjust" data-id="${r.id}" ${V.pins.length?'':'disabled'}>${ic('pen',16)} Enviar ${V.pins.length||''} ajuste${V.pins.length===1?'':'s'} · quedan ${left} ronda${left===1?'':'s'}</button>`:`<span class="faint" style="font-size:13.5px;align-self:center">Se usaron las ${CFG().maxRounds} rondas; habla con el supervisor para más cambios.</span>`}</div></div>`;
  } else if(r.status==='ajustes' && r.proposal){
    main = `<div class="card"><h3>Tus ajustes (ronda ${r.rounds})</h3>${annotHTML(r,false)}</div>`;
  } else if(r.status==='entregada'){
    main = `<div class="card"><h3>Pieza entregada</h3>${r.finalThumb?pieceBox(r,r.finalThumb,'Tu pieza final',r.finalFile,r.driveUrl):(r.proposal?annotHTML(r,false,true):'')}<p style="margin-top:14px" class="muted">Enviada a ${h(m.email)} el ${fmt(r.delivered)}${r.driveUrl?' · también en tu carpeta de Drive':''}.</p></div>`;
  } else if(r.status==='devuelta'){
    main = `<div class="card"><div class="alert amber" style="margin:0 0 16px">${ic('bell')}<p><b>Falta información:</b> ${h(r.returnReason)}</p></div><textarea class="in" id="resIn" placeholder="Escribe aquí lo que falta"></textarea><button class="btn pri" style="margin-top:10px" data-a="resend" data-id="${r.id}">Reenviar solicitud</button></div>`;
  }
  return `<button class="back" data-a="go" data-r="home">${ic('back',16)} Mis solicitudes</button>
    <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap"><span class="idc">${h(r.id)}</span>${stChip(r.status)}${r.priority?chip(r.priority.status==='pendiente'?'Prioridad en revisión':r.priority.status==='aprobada'?'Prioridad aprobada':'Prioridad no aprobada', r.priority.status==='rechazada'?'gray':'coral'):''}</div>
    <h1 class="big" style="margin-top:12px">${h(r.title)}</h1>
    ${act?`<div class="kpis" style="margin-top:22px">
      <div class="kpi"><small>Te la entregan</small><b style="font-size:26px;margin-top:12px">${fmt(effDue(r))}</b><em>${r.priority&&r.priority.status==='pendiente'?'Si aprueban la prioridad: '+fmt(r.due):'Plazo estándar: '+SLA(r.type)+' días hábiles'}</em></div>
      <div class="kpi"><small>Posición en la fila</small><b>${p+1}</b><em>de ${queue().length} · puede cambiar si entra una prioridad</em></div>
      <div class="kpi"><small>Responsable</small><b style="font-size:20px;margin-top:14px">${r.assignee?h(first(U(r.assignee))):'Por asignar'}</b><em>${r.assignee?h(U(r.assignee).area):'El supervisor la asigna'}</em></div>

    <div class="grid2" style="margin-top:24px"><div>

/* ---------- balance (supervisor) ---------- */
function balanceView(){
  const all = S.reqs, T = today();
  const months = {}; all.forEach(r=>{ const k = iso(r.created).slice(0,7); months[k] = months[k]||{req:0,del:0}; months[k].req++; if(r.status==='entregada') months[k].del++; });
  const mk = Object.keys(months).sort().slice(-6), maxM = Math.max(1,...mk.map(k=>months[k].req));
  const del = all.filter(r=>r.status==='entregada');
  const turn = del.map(r=>bizDiff(new Date(r.created), new Date(r.delivered)));
  const avgTurn = turn.length ? (turn.reduce((a,b)=>a+b,0)/turn.length).toFixed(1) : '—';
  const ontime = del.filter(r=>iso(r.delivered)<=r.due).length;
  const rounds = all.filter(r=>r.proposal); const avgRounds = rounds.length ? (rounds.reduce((a,r)=>a+r.rounds,0)/rounds.length).toFixed(1) : '—';
  const noAdj = rounds.length ? Math.round(rounds.filter(r=>r.rounds===0).length/rounds.length*100) : 0;
  const by = (key, label) => { const m = {}; all.forEach(r=>{ const k = key(r); if(!k) return; m[k] = m[k]||{n:0,del:0,adj:0}; m[k].n++; if(r.status==='entregada') m[k].del++; m[k].adj += r.rounds; }); return Object.entries(m).sort((a,b)=>b[1].n-a[1].n); };
  const areas = by(r=>r.area), types = by(r=>TY(r.type).label), des = by(r=>r.assignee && U(r.assignee) && U(r.assignee).name);
  const bars = (rows, color) => { const mx = Math.max(1,...rows.map(x=>x[1].n)); return `<div class="bars">${rows.map(([k,v])=>`<div class="bar"><span class="trunc" title="${h(k)}">${h(k)}</span><div class="tr"><div class="fl" style="width:${v.n/mx*100}%;background:${color}"></div></div><b>${v.n}</b></div>`).join('')}</div>`; };
  const prio = all.filter(r=>r.priority).length, prioOk = all.filter(r=>r.priority&&r.priority.status==='aprobada').length;
  return `<div class="head"><div><h1 class="big">Balance</h1><p class="lead">Cómo se comporta la demanda y el equipo. Con datos de la demo los números son ilustrativos; con uso real se vuelven el argumento para pedir recursos o ajustar plazos.</p></div><button class="btn" data-a="exportCsv">${ic('copy',16)} Exportar CSV</button></div>
    <div class="kpis">
      <div class="kpi"><small>Piezas este mes</small><b>${(months[iso(T).slice(0,7)]||{req:0}).req}</b><em>${(months[iso(T).slice(0,7)]||{del:0}).del} entregadas</em></div>
      <div class="kpi"><small>Tiempo promedio</small><b>${avgTurn}</b><em>días hábiles de solicitud a entrega</em></div>
      <div class="kpi"><small>Entregadas a tiempo</small><b>${del.length?Math.round(ontime/del.length*100)+'%':'—'}</b><em>${ontime} de ${del.length}</em></div>
      <div class="kpi"><small>Rondas de ajustes</small><b>${avgRounds}</b><em>${noAdj}% aprobadas sin cambios</em></div>
      <div class="kpi"><small>Prioridades</small><b>${prio}</b><em>${prioOk} aprobadas · ${prio-prioOk} negadas o pendientes</em></div>
    </div>
    <div class="split" style="margin-top:24px">
      <div class="card"><h3>Solicitudes por mes</h3><div class="bars">${mk.map(k=>`<div class="bar"><span>${k}</span><div class="tr"><div class="fl" style="width:${months[k].req/maxM*100}%"></div></div><b>${months[k].req}</b></div>`).join('')||'<div class="empty">Sin datos</div>'}</div><p class="faint" style="font-size:12.5px;margin-top:14px">Recibidas en el mes; la barra crece con el uso real.</p></div>
      <div class="card"><h3>Qué áreas piden más</h3>${bars(areas,'var(--teal)')}<p class="faint" style="font-size:12.5px;margin-top:14px">Las áreas se toman de la cuenta de cada solicitante; se ajustan por empresa en Configuración.</p></div>

    </div>`;
}

/* ---------- wizard ---------- */
const isPrio = () => W.d.type && W.d.due && W.d.due < iso(addBiz(today(),SLA(W.d.type)));
function wValid(s){
  const d = W.d;
  if(s===1) return !!d.type && d.title.trim().length>=3 && d.formats.length>0;
  if(s===2) return !!d.objective && d.audience.length>0 && d.context.trim().length>=10;
  if(s===3) return d.pieceText.trim().length>0;
  if(s===4) return !!d.due && d.due>=iso(today()) && (!isPrio() || d.reason.trim().length>=10);
  return true;
}

  }
  if(s===5){
    const t = TY(d.type), row = (l,v,st) => `<dt>${l}</dt><dd>${v}</dd><dd><button class="link" data-a="wGo" data-s="${st}">Editar</button></dd>`;

function wSubmit(){
  const d = W.d, m = me(), t = TY(d.type), prio = isPrio();

  S.reqs.push(r); log(r,'Creó la solicitud'+(prio?' con prioridad':''));

  save(); V.sentId = id; resetW(); go('sent');
}

    ${r.status==='devuelta'?`<div class="alert amber" style="margin-top:0;margin-bottom:20px">${ic('bell')}<p><b>Devuelta por falta de información:</b> ${h(r.returnReason)}</p></div>`:''}

      ${r.status==='aprobacion' && r.proposal ? `<div class="card"><h3>Propuesta enviada · esperando a ${h(first(U(r.requester)))}</h3>${annotHTML(r,false,true)}</div>`:''}

        <div style="margin-top:20px"><small class="faint" style="font-size:12px;letter-spacing:.06em">CONTEXTO</small><p style="margin-top:6px;white-space:pre-wrap">${h(r.context)}</p></div></div>
      <div class="card"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px"><h3 style="margin:0">Texto dentro de la pieza</h3><button class="btn sm" data-a="copy" data-id="${r.id}">${ic('copy',14)} Copiar</button></div><div class="piece">${h(r.pieceText)}</div>

function actionsHTML(r,m){
  const out = [], canAssign = CAN.assign(m), staff = CAN.work(m,r);
  if(canAssign && (ACTIVE.includes(r.status) || r.status==='devuelta')){
    out.push(`<label class="faint" style="font-size:13px">${r.assignee?'Reasignar':'Asignar a'}</label><select class="in sel" data-change="assign" data-id="${r.id}" style="padding:11px 36px 11px 14px"><option value="">Seleccionar…</option>${designers().map(d=>`<option value="${d.id}" ${r.assignee===d.id?'selected':''}>${h(d.name)}${d.id===m.id?' (yo)':''} · ${S.reqs.filter(x=>x.assignee===d.id&&ACTIVE.includes(x.status)).length} activas${d.video?' · video':''}</option>`).join('')}</select>`);
  }
  if(CAN.prio(m) && r.priority && r.priority.status==='pendiente') out.push(`<div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn sm pri" data-a="prioOk" data-id="${r.id}">${ic('flag',14)} Aprobar prioridad</button><button class="btn sm" data-a="prioNo" data-id="${r.id}">Mantener fecha estándar</button></div>`);
  if(staff && r.assignee){
    if(r.status==='asignada') out.push(`<button class="btn pri" data-a="start" data-id="${r.id}">Iniciar diseño ${ic('arrow',16)}</button>`);
    if(['diseno','ajustes'].includes(r.status)) out.push(`<div class="drop" data-a="pickProp" style="padding:14px">${ic('clip',20)}<div style="font-size:13.5px"><b style="font-weight:500;color:var(--ink)">${V.propFile?h(V.propFile.name):'Adjuntar imagen de la propuesta'}</b><div>Si no adjuntas, la demo usa una imagen de ejemplo.</div></div></div><button class="btn pri" data-a="propose" data-id="${r.id}">${ic('mail',16)} Enviar propuesta para aprobación</button>`);
    if(r.status==='aprobada') out.push(`<div class="drop" data-a="pickProp" style="padding:14px">${ic('clip',20)}<div style="font-size:13.5px"><b style="font-weight:500;color:var(--ink)">${V.propFile?h(V.propFile.name):'Adjuntar archivo final'}</b><div>Si no adjuntas, se entrega la propuesta aprobada.</div></div></div><button class="btn pri" data-a="deliver" data-id="${r.id}">${ic('mail',16)} Entregar por correo</button>`);
  }
  if(staff && ['recibida','revision','asignada'].includes(r.status)) out.push(`<textarea class="in" id="retIn" placeholder="¿Qué información falta?"></textarea><button class="btn" data-a="devolver" data-id="${r.id}">Devolver por falta de información</button>`);
  if(CAN.cancel(m) && (ACTIVE.includes(r.status)||r.status==='devuelta')) out.push(`<details style="margin-top:4px"><summary class="faint" style="cursor:pointer;font-size:13.5px">Cancelar solicitud</summary><div class="act" style="margin-top:10px"><textarea class="in" id="canIn" placeholder="Motivo (queda en el historial)"></textarea><button class="btn danger" data-a="cancelDir" data-id="${r.id}">Cancelar solicitud</button></div></details>`);
  return out.length ? `<div class="act">${out.join('')}</div>` : `<p class="faint" style="font-size:14px">No tienes acciones pendientes en este estado.</p>`;
}

document.addEventListener('click', e => {
  const an = e.target.closest('[data-annot]');
  if(an && !e.target.closest('[data-a]')){ const rc = an.getBoundingClientRect(); const x = Math.round((e.clientX-rc.left)/rc.width*1000)/10, y = Math.round((e.clientY-rc.top)/rc.height*1000)/10; document.querySelectorAll('[data-pin]').forEach(i=>{ V.pins[+i.dataset.pin].t = i.value; }); V.pins.push({x,y,t:''}); render(); const last = document.querySelectorAll('[data-pin]'); if(last.length) last[last.length-1].focus(); return; }
  const t = e.target.closest('[data-a]'); if(!t) return;
  if(t.tagName==='SELECT' || e.target.closest('select')) return;
  if(V.menu && t.dataset.a!=='menu' && !t.closest('.menu')) V.menu = false;
  if(t.dataset.a==='open') V.prev = V.route;
  const f = ACT[t.dataset.a]; if(f){ e.preventDefault(); f(t,e); }
});
document.addEventListener('change', e => {
  const t = e.target;
  if(t.dataset.change==='assign'){ assign(R(t.dataset.id), t.value); }
  if(t.dataset.wd){ W.d[t.dataset.wd] = t.value; render(); }
  if(t.dataset.integ){ const k=t.dataset.integ; INTEG[k] = k==='on' ? t.checked : t.value.trim(); saveInteg(); toast('Integración guardada'); }
  if(t.dataset.cfg){ const k = t.dataset.cfg; if(k==='holidays') S.cfg.holidays = t.value.split('\n').map(x=>x.trim()).filter(x=>/^\d{4}-\d{2}-\d{2}$/.test(x)); else if(k==='areas') S.cfg.areas = t.value.split('\n').map(x=>x.trim()).filter(Boolean); else if(k.startsWith('sla.')) S.cfg.sla[k.slice(4)] = Math.max(1,+t.value||1); else S.cfg[k] = Math.max(1,+t.value||1); save(); toast('Configuración guardada'); }
  if(t.id==='fileIn'){
    const files = [...t.files];
    Promise.all(files.map(f => new Promise(res => {
      if(!f.type.startsWith('image/')) return res({name:f.name,size:f.size});
      const rd = new FileReader();
      rd.onload = () => { const img = new Image(); img.onload = () => { const max = V.pickFor==='wizard'?1000:1200; const c = document.createElement('canvas'), s = Math.min(1,max/Math.max(img.width,img.height)); c.width = Math.max(1,Math.round(img.width*s)); c.height = Math.max(1,Math.round(img.height*s)); c.getContext('2d').drawImage(img,0,0,c.width,c.height); res({name:f.name,size:f.size,mime:f.type,thumb:c.toDataURL('image/jpeg',.78)}); }; img.onerror = () => res({name:f.name,size:f.size}); img.src = rd.result; };
      rd.onerror = () => res({name:f.name,size:f.size}); rd.readAsDataURL(f);
    }))).then(arr => { if(V.pickFor==='prop'){ V.propFile = arr.find(a=>a.thumb)||null; } else W.d.files.push(...arr); t.value=''; render(); });
  }
});
document.addEventListener('input', e => {
  const t = e.target;
  if(t.dataset.w){ W.d[t.dataset.w] = t.value; const b = $('#wNext'); if(b) b.disabled = !wValid(W.step); }
  if(t.dataset.pin){ V.pins[+t.dataset.pin].t = t.value; const b = document.querySelector('[data-a="adjust"]'); if(b) b.disabled = !V.pins.some(p=>p.t.trim()); }
  if(t.id==='q'){ V.q = t.value; if(V.route==='list'){ const lb = $('#listBody'); if(lb) lb.innerHTML = listRows(); } }
});
document.addEventListener('keydown', e => {
  if((e.metaKey||e.ctrlKey) && e.key.toLowerCase()==='k'){ e.preventDefault(); const q = $('#q'); if(q){ q.focus(); q.select(); } }
  if(e.key==='Enter' && e.target.id==='q'){ V.filter='all'; go('list'); setTimeout(()=>{ const q=$('#q'); if(q){ q.focus(); q.setSelectionRange(q.value.length,q.value.length); } }); }
  if(e.key==='Escape' && (V.menu||V.side||V.lb||V.lbimg)){ V.menu=false; V.side=false; V.lb=null; V.lbimg=null; render(); }
});
document.addEventListener('submit', e => {
  if(e.target.dataset.form==='login'){
    e.preventDefault();
    const email = e.target.email.value.trim().toLowerCase();
    if(!email.endsWith('@'+S.domain)){ $('#lerr').textContent = 'Solo pueden entrar cuentas @'+S.domain+'. Las personas externas no pueden crear solicitudes.'; return; }
    const u = S.users.find(x=>x.email===email);
    if(!u){ $('#lerr').textContent = 'Esa cuenta no está registrada en la demo. Usa una de las cuentas de demostración.'; return; }
    S.session = u.id; save(); intro(()=>go('home'));
  }
});
render();

</script>
</body>
</html>
